services:
  # PostgreSQL with pgvector
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: helios-postgres
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-heliosuser} -d ${DATABASE_DB:-helios}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend (FastAPI)
  backend:
    build:
      context: ./backend/
      dockerfile: Dockerfile
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
        ITHACA_MODEL_BASE_URL: ${ITHACA_MODEL_BASE_URL:-https://storage.googleapis.com/ithaca-resources/models}
        BACKEND_CPUS_LIMIT: ${BACKEND_CPUS_LIMIT:-5}
        BACKEND_PORT: ${BACKEND_PORT:-8000}
    container_name: helios-backend
    env_file: .env
    volumes:
      - backend_logs:/app/logs
    ports:
      - "${BACKEND_PORT_HOST:-8000}:${BACKEND_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:${BACKEND_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Startup re-scans 1612 XML files, 178k inscriptions, and loads three
      # JAX checkpoints before /health is routed. uvicorn binds the port well
      # before that finishes, so probes connect and fail until it does.
      start_period: ${BACKEND_START_PERIOD:-10m}
    restart: unless-stopped
    # Ithaca beam search is CPU- and memory-hungry (a wide beam materializes
    # multi-GB attention tensors). Cap it so it cannot starve postgres/ollama or
    # OOM the host. BACKEND_CPUS_LIMIT is also forwarded as a build arg so the
    # *_NUM_THREADS pools baked into backend/Dockerfile stay in sync (rebuild
    # to apply a changed limit there).
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPUS_LIMIT:-5}"
          memory: "${BACKEND_MEMORY_LIMIT:-10g}"

  # Frontend (React/Vite with Caddy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://backend:8000}
        FRONTEND_PORT: ${FRONTEND_PORT:-8888}
    container_name: helios-frontend
    ports:
      - "${FRONTEND_PORT_HOST:-8888}:${FRONTEND_PORT:-8888}"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:${FRONTEND_PORT:-8888}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Ollama (LLM service)
  # Note: This is a placeholder. Ollama needs to be installed on the host
  # or run with GPU support. For now, configure it to connect to host Ollama.
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: helios-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT_HOST:-11434}:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
    restart: unless-stopped
    # Uncomment if you have GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Perseus Digital Library (MariaDB with MySQL dumps)
  # On first boot of an empty perseus_data volume, the entrypoint runs
  # perseus/init/00-load-dumps.sh, which imports ~839MB of dumps. That takes a
  # while and the server does not accept external connections until it is done.
  perseus-db:
    image: ${PERSEUS_DB_IMAGE:-mariadb:11}
    container_name: helios-perseus-db
    environment:
      MYSQL_ROOT_PASSWORD: ${PERSEUS_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PERSEUS_MYSQL_DATABASE}
    volumes:
      # :Z relabels for SELinux so rootless podman can read the bind mounts.
      - ./perseus/dumps:/dumps:ro,Z
      - ./perseus/init:/docker-entrypoint-initdb.d:ro,Z
      - perseus_data:/var/lib/mysql
    ports:
      - "${PERSEUS_PORT_HOST:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 10
      # Long grace period: the initial dump import blocks readiness.
      start_period: 60m
    restart: unless-stopped

  # Adminer (web UI for inspecting the Perseus database)
  adminer:
    image: ${ADMINER_IMAGE:-adminer:latest}
    container_name: helios-adminer
    environment:
      ADMINER_DEFAULT_SERVER: perseus-db
    ports:
      - "${ADMINER_PORT_HOST:-8080}:8080"
    depends_on:
      - perseus-db
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  backend_logs:
  perseus_data:
