services:
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: helios-postgres
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heliosuser -d helios"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend (FastAPI)
  backend:
    build:
      context: ./backend/
      dockerfile: Dockerfile
    container_name: helios-backend
    env_file: .env
    environment:
      # Where to reach inference. Production overrides this with the Cloud Run
      # service URL; an unreachable service degrades the inscription endpoints
      # rather than failing them, so this is not a hard dependency.
      ITHACA_SERVICE_URL: http://ithaca:8001
    volumes:
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Startup re-scans 1612 XML files and 178k inscriptions before /health is
      # routed. uvicorn binds :8000 well before that finishes, so probes connect
      # and fail until it does. No longer loads model checkpoints -- that cost
      # moved to the ithaca service.
      start_period: 10m
    restart: unless-stopped
    # No longer runs inference, so the old beam-search headroom is gone. What
    # remains is the startup corpus scan and normal request serving.
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6g

  # Ithaca/Aeneas inference.
  #
  # In production this is a separate, GPU-backed Cloud Run service that scales
  # to zero; the backend reaches it over HTTP and degrades to "model
  # unavailable" when it cannot. This container is the local stand-in: the same
  # image and the same API, built against CPU JAX so the stack runs offline
  # with no GPU and no GCP credentials.
  #
  # It replaces the former ithaca-shard-1/2 pair. Those existed to split a
  # beam-search batch across machines because the CPU forward pass saturates at
  # ~2 cores; a single accelerator runs the whole beam in one pass, so the
  # sharding layer was removed along with them.
  #
  # Expect a slow first request: it loads ~2GB of checkpoints at startup.
  ithaca:
    build:
      context: ./ithaca-service/
      dockerfile: Dockerfile
    container_name: helios-ithaca
    environment:
      # Skips ID-token verification. Safe here because the port is only
      # published to the host; never set this on a reachable deployment.
      ITHACA_DEBUG: "True"
      INSCRIPTIONS_DIR: /app/assets/inscriptions
    volumes:
      # The checkpoints are baked into the production image but mounted here,
      # so a local rebuild does not re-download ~2GB. Populate this directory
      # with the six files listed in ithaca-service/Dockerfile.
      - ./ithaca-service/assets/inscriptions:/app/assets/inscriptions:ro,Z
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Checkpoint load dominates: this is the same cost that shows up as cold
      # start on Cloud Run.
      start_period: 5m
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "5"
          memory: 8g

  # Frontend (React/Vite with nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: helios-frontend
    ports:
      - "8888:8888"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Ollama (LLM service)
  # Note: This is a placeholder. Ollama needs to be installed on the host
  # or run with GPU support. For now, configure it to connect to host Ollama.
  ollama:
    image: ollama/ollama:latest
    container_name: helios-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
    restart: unless-stopped
    # Uncomment if you have GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Perseus Digital Library (MariaDB with MySQL dumps)
  # On first boot of an empty perseus_data volume, the entrypoint runs
  # perseus/init/00-load-dumps.sh, which imports ~839MB of dumps. That takes a
  # while and the server does not accept external connections until it is done.
  perseus-db:
    image: mariadb:11
    container_name: helios-perseus-db
    environment:
      MYSQL_ROOT_PASSWORD: ${PERSEUS_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PERSEUS_MYSQL_DATABASE}
    volumes:
      # :Z relabels for SELinux so rootless podman can read the bind mounts.
      - ./perseus/dumps:/dumps:ro,Z
      - ./perseus/init:/docker-entrypoint-initdb.d:ro,Z
      - perseus_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 10
      # Long grace period: the initial dump import blocks readiness.
      start_period: 60m
    restart: unless-stopped

  # Adminer (web UI for inspecting the Perseus database)
  adminer:
    image: adminer:latest
    container_name: helios-adminer
    environment:
      ADMINER_DEFAULT_SERVER: perseus-db
    ports:
      - "8080:8080"
    depends_on:
      - perseus-db
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  backend_logs:
  perseus_data:
