[project]
name = "helios-backend"
version = "0.1.0"
description = "Backend for Helios"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = "~=3.13.0"

dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10.0",
    "authlib>=1.7.2",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "cltk[stanza]>=2.5.1",
    "python-dotenv>=1.2.2",
    "itsdangerous>=2.2.0",
    "pillow>=12.3.0",
    "tqdm>=4.70.0",
    "openai>=2.52.0",
    # Mints the OIDC ID token used to call the Ithaca inference service. The
    # [requests] extra is required -- google.auth.transport.requests raises
    # ImportError without it.
    "google-auth[requests]>=2.43.0",
    # Transitive via cltk[stanza] -> stanza. Listed directly only so the
    # [tool.uv.sources] pin below applies — uv ignores sources for deps that
    # are purely transitive, and PyPI's default torch is the +cuXXX build.
    "torch>=2.13.0",
]

# Nothing here runs on GPU: stanza resolves to device 'cpu', and model
# inference has moved out of this image entirely (see ithaca-service/). The
# default torch wheel drags in ~2.7GB of unreachable CUDA (19
# nvidia-*/cuda-*/triton packages), so pin the CPU wheel instead.
# Revert this block if the backend ever needs to target a CUDA machine.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
# `src/` is the Python root, so tests need it on sys.path to resolve the
# absolute imports the codebase uses (`from config import settings`).
pythonpath = ["src"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
]
