[project]
name = "helios-backend"
version = "0.1.0"
description = "Backend for Helios"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = "~=3.13.0"

dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10.0",
    "authlib>=1.7.2",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "cltk[stanza]>=2.5.1",
    "python-dotenv>=1.2.2",
    "itsdangerous>=2.2.0",
    "jax>=0.11.0",
    "jaxlib>=0.11.0",
    "flax>=0.12.8",
    "ml-collections>=1.1.0",
    "pillow>=12.3.0",
    "tqdm>=4.70.0",
    "openai>=2.52.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
# `src/` is the Python root, so tests need it on sys.path to resolve the
# absolute imports the codebase uses (`from config import settings`).
pythonpath = ["src"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
]
